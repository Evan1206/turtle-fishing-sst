[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turtle-fishing-sst"
version = "0.1.0"
description = "Sea turtle, fishing effort, and sea surface temperature spatial analysis"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "python-dotenv",
    "matplotlib",
    "gfw-api-python-client",
    "pyarrow",
    "scipy",
]

[tool.setuptools]
packages = ["src"]
